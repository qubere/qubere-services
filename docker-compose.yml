# Local convenience for running both reference apps together (the "agent-per-Boot" topology).
# Each service builds from its own Dockerfile with this file's directory (the repo root) as the
# build context, since both modules depend on the sibling reactor modules.
#
#   docker compose build
#   docker compose up
#
# Both services run standalone by default: in-memory H2, permissive authorization, no external
# model provider configured. Override any agent-platform.* setting via environment variables
# (see README.md for the full reference) to point at a real datasource/model/IdP.
services:
  qubere-echo-agent:
    build:
      context: .
      dockerfile: qubere-echo-agent/Dockerfile
    image: qubere-echo-agent:local
    ports:
      - "8080:8080"
    environment:
      SERVER_PORT: "8080"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 5s
      start_period: 45s
      retries: 3

  qubere-document-agent:
    build:
      context: .
      dockerfile: qubere-document-agent/Dockerfile
    image: qubere-document-agent:local
    ports:
      - "8081:8081"
    environment:
      SERVER_PORT: "8081"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8081/actuator/health"]
      interval: 30s
      timeout: 5s
      start_period: 45s
      retries: 3

name: Docker Publish

# Builds and publishes container images to GitHub Container Registry (GHCR). Runs only after CI
# has proven the reactor builds and every test passes -- an image is never published from code
# that hasn't cleared the quality gate.
on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io

jobs:
  test:
    name: Build and test
    uses: ./.github/workflows/ci.yml

  publish:
    name: Publish ${{ matrix.image }}
    runs-on: ubuntu-latest
    needs: test
    strategy:
      matrix:
        include:
          - module: qubere-echo-agent
            image: qubere-echo-agent
          - module: qubere-document-agent
            image: qubere-document-agent
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.image }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha,prefix=sha-,format=short

      - name: Build and push ${{ matrix.image }}
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.module }}/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

      - name: Scan image for known vulnerabilities
        uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.image }}@${{ steps.build.outputs.digest }}
          format: table
          severity: CRITICAL,HIGH
          # Informational, not a release gate: the framework's own posture is judged on the code
          # in this repo, not on how quickly an upstream base image ships a CVE patch. Findings
          # are surfaced in the workflow log for the team to triage, not used to block a publish.
          exit-code: '0'

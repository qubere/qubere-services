spring:
  datasource:
    url: ${AGENT_DATASOURCE_URL:jdbc:h2:mem:qubere_agents;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=false}
    username: ${AGENT_DATASOURCE_USERNAME:sa}
    password: ${AGENT_DATASOURCE_PASSWORD:}
    driver-class-name: org.h2.Driver
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: ${AGENT_JPA_DDL_AUTO:update}
